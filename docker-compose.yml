services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal_health_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    # No montamos volúmenes: todo viene baked en la imagen
